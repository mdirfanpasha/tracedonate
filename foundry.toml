[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY:-}", url = "https://testnet.monadvision.com/api" }
