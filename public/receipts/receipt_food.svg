<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Receipt Paper Container -->
  <rect x="50" y="20" width="700" height="560" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#paper-shadow)" />
  
  <!-- Top Accent Bar -->
  <rect x="50" y="20" width="700" height="8" rx="4" fill="#059669" />
  
  <!-- Header -->
  <g transform="translate(90, 60)">
    <rect x="0" y="0" width="42" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <path d="M12 21h18M21 12v18" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    
    <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a">APEX HUMANITARIAN FOOD SUPPLIES LTD.</text>
    <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Direct Relief Supply Partner • Reg #AGR-882910 • Warehouse Sector 4</text>
  </g>
  
  <!-- Invoice Meta Box -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="620" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="20" y="24" font-family="monospace" font-size="10" font-weight="600" fill="#64748b">INVOICE NO.</text>
    <text x="20" y="44" font-family="monospace" font-size="14" font-weight="800" fill="#0f172a">INV-8492</text>
    
    <text x="170" y="24" font-family="monospace" font-size="10" font-weight="600" fill="#64748b">ISSUE DATE</text>
    <text x="170" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Feb 20, 2026</text>
    
    <text x="320" y="24" font-family="monospace" font-size="10" font-weight="600" fill="#64748b">PAYMENT METHOD</text>
    <text x="320" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#059669">Monad Escrow Payout</text>
    
    <text x="490" y="24" font-family="monospace" font-size="10" font-weight="600" fill="#64748b">STATUS</text>
    <text x="490" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#059669">✓ SETTLED</text>
  </g>
  
  <!-- Line Items Table -->
  <g transform="translate(90, 200)">
    <!-- Table Header -->
    <rect x="0" y="0" width="620" height="30" rx="4" fill="#0f172a" />
    <text x="15" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">ITEM DESCRIPTION</text>
    <text x="340" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">QTY</text>
    <text x="440" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">UNIT PRICE</text>
    <text x="605" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">TOTAL (MON)</text>
    
    <!-- Row 1 -->
    <text x="15" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Emergency High-Protein Grain Kits (25kg Bags)</text>
    <text x="340" y="55" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">3,000</text>
    <text x="440" y="55" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">0.004 MON</text>
    <text x="605" y="55" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">12.000 MON</text>
    <line x1="0" y1="70" x2="620" y2="70" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Row 2 -->
    <text x="15" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Nutritional Paste Bundles &amp; Baby Food Care</text>
    <text x="340" y="95" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">2,000</text>
    <text x="440" y="95" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">0.0025 MON</text>
    <text x="605" y="95" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">5.000 MON</text>
    <line x1="0" y1="110" x2="620" y2="110" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Row 3 -->
    <text x="15" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Purified Drinking Water 20L Jerrycans</text>
    <text x="340" y="135" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">1,400</text>
    <text x="440" y="135" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">0.0025 MON</text>
    <text x="605" y="135" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">3.500 MON</text>
    <line x1="0" y1="150" x2="620" y2="150" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Total Section -->
    <text x="440" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">TOTAL SETTLED:</text>
    <text x="605" y="180" font-family="monospace" font-size="18" font-weight="800" fill="#059669" text-anchor="end">20.500 MON</text>
  </g>
  
  <!-- Red PAID & AUDITED Stamp -->
  <g transform="translate(480, 410) rotate(-8)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 4" opacity="0.9"/>
    <text x="110" y="28" font-family="monospace" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="2">PAID &amp; AUDITED</text>
    <text x="110" y="48" font-family="monospace" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">TRACE DONATE • MONAD</text>
    <text x="110" y="60" font-family="monospace" font-size="8" font-weight="600" fill="#dc2626" text-anchor="middle">TX: 0x892a23381A17f...1014</text>
  </g>
  
  <!-- Footer Barcode & Verification Details -->
  <g transform="translate(90, 480)">
    <!-- Fake Barcode -->
    <rect x="0" y="0" width="3" height="35" fill="#0f172a"/>
    <rect x="5" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="9" y="0" width="4" height="35" fill="#0f172a"/>
    <rect x="15" y="0" width="1" height="35" fill="#0f172a"/>
    <rect x="18" y="0" width="5" height="35" fill="#0f172a"/>
    <rect x="25" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="29" y="0" width="3" height="35" fill="#0f172a"/>
    <rect x="34" y="0" width="1" height="35" fill="#0f172a"/>
    <rect x="37" y="0" width="4" height="35" fill="#0f172a"/>
    <rect x="43" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="47" y="0" width="5" height="35" fill="#0f172a"/>
    <rect x="54" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="58" y="0" width="3" height="35" fill="#0f172a"/>
    <rect x="63" y="0" width="1" height="35" fill="#0f172a"/>
    <rect x="66" y="0" width="4" height="35" fill="#0f172a"/>
    <rect x="72" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="76" y="0" width="6" height="35" fill="#0f172a"/>
    <rect x="84" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="88" y="0" width="3" height="35" fill="#0f172a"/>
    <rect x="93" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="97" y="0" width="4" height="35" fill="#0f172a"/>
    <rect x="103" y="0" width="2" height="35" fill="#0f172a"/>
    <rect x="107" y="0" width="5" height="35" fill="#0f172a"/>
    <rect x="114" y="0" width="1" height="35" fill="#0f172a"/>
    <rect x="117" y="0" width="4" height="35" fill="#0f172a"/>
    <text x="0" y="48" font-family="monospace" font-size="9" fill="#64748b">INV-8492-MONAD-ESCROW-SETTLED</text>
    
    <!-- Signature Line -->
    <line x1="240" y1="35" x2="380" y2="35" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="310" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">Authorized Warehouse Dispatch</text>
  </g>
</svg>
